name: arabic_text CI

on:
  push:
    paths:
      - 'packages/arabic_text/**'
      - 'test_fixtures/**'
      - 'tools/**'
      - '.github/workflows/arabic_text.yml'
  pull_request:

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - run: cd packages/arabic_text/dart && dart pub get
      - run: cd packages/arabic_text/dart && dart analyze
      - run: cd packages/arabic_text/dart && dart test

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - run: cd packages/arabic_text/js && if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: cd packages/arabic_text/js && npm run build
      - run: cd packages/arabic_text/js && npm test

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: cd packages/arabic_text/python && python -m pip install --upgrade pip
      - run: cd packages/arabic_text/python && pip install -e . pytest
      - run: cd packages/arabic_text/python && python -m pytest tests/ -v
      - run: python -m unittest discover -s tools/parity -p test_compare.py -q
      - run: python tools/packaging/check_npm_metadata.py
      - run: cd packages/arabic_text/python && python -m pip wheel . --no-deps -w dist
      - run: cd packages/arabic_text/python && python -c "from setuptools import build_meta; build_meta.build_sdist('dist')"
      - run: python tools/packaging/check_python_artifacts.py packages/arabic_text/python/dist/*.whl packages/arabic_text/python/dist/*.tar.gz

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python tools/ci/check_workflow.py
      - run: cd packages/arabic_text/dart && dart pub get
      - run: cd packages/arabic_text/js && npm ci && npm run build
      - run: mkdir -p parity-results
      - run: python tools/parity/run_python.py --corpus tools/parity/corpus.json --out parity-results/python.json
      - run: dart run tools/parity/run_dart.dart tools/parity/corpus.json parity-results/dart.json
      - run: node tools/parity/run_javascript.cjs packages/arabic_text/js/dist/index.js tools/parity/corpus.json parity-results/typescript.json
      - run: python tools/parity/compare.py --corpus tools/parity/corpus.json --port dart=parity-results/dart.json --port typescript=parity-results/typescript.json --port python=parity-results/python.json --out-json parity-results/result.json --out-md parity-results/result.md
      - run: python -m unittest discover -s tools/parity -p test_compare.py -q
